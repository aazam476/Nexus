# Checks every push and pull request. If this passes, the app builds, every API route works against a
# real database and mail server, and the main flows work in a real browser.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    # The same services as docker-compose.dev.yml: a database, Redis, and a throwaway mail server.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexus" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ['3025:3025', '3110:3110', '3143:3143', '3465:3465', '3993:3993', '3995:3995']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w apps/server prisma generate

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: |
          npm run typecheck -w apps/server
          npx -w apps/web tsc --noEmit
          npx -w apps/web tsc -p e2e

      - name: Wait for the mail server
        run: for i in $(seq 60); do nc -z localhost 3993 && nc -z localhost 3025 && exit 0; sleep 2; done; exit 1

      - name: Server tests (unit and integration)
        run: npx -w apps/server vitest run --coverage

      - name: Web unit tests
        run: npx -w apps/web vitest run --coverage

      - name: Browser tests
        run: |
          npx -w apps/web playwright install --with-deps chromium
          npm run test:e2e -w apps/web

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t nexus:ci .
