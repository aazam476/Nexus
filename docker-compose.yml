# Nexus: one database, one Redis, one app container.
# Copy .env.example to .env and set APP_SECRET before the first start.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nexus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus}@db:5432/nexus
      REDIS_URL: redis://redis:6379
    volumes:
      - ./plugins:/app/plugins:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
  redis-data:
